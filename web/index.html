<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mudra Finance and Banking Software</title>
  <meta name="description" content="Mudra — keyboard-first accounting, inventory, GST and banking software inspired by Tally.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2a4a'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23e8b33a'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/mudra.css">
</head>
<body>
  <header id="topbar">
    <div id="brand" title="Gateway (Ctrl+Q)"><span class="brand-mark">₹</span><span class="brand-name">MUDRA</span><span class="brand-sub">Finance &amp; Banking</span></div>
    <nav id="topmenu" aria-label="Main menu"></nav>
  </header>
  <div id="titlebar">
    <span id="screen-title"></span>
    <span id="company-title"></span>
    <span class="esc-hint"><kbd>Esc</kbd> back</span>
  </div>
  <div id="body">
    <main id="main"></main>
    <div id="picker-host"></div>
    <aside id="buttonbar" aria-label="Shortcuts"></aside>
  </div>
  <footer id="statusbar">
    <span id="statusbar-date"></span>
    <span class="status-right">Mudra Finance and Banking Software · <kbd>Alt+G</kbd> Go To · <kbd>F1</kbd> Help</span>
  </footer>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Mudra needs JavaScript enabled.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
